name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - '_eex/**'
      - '_pages/**'
      - '_posts/**'
      - 'config/**'
      - 'extra/**'
      - 'lib/**'
      - 'build.js'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Required to push container images to GHCR

    environment: publish

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DCHOOK_VERSION: v1.3.2
      DCHOOK_BASE: 'dchook_Linux_x86_64'
      DCHOOK_URL: https://dch.halostatue.ca
      DOCKER_HUB_USERNAME: halostatue

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            _http._tcp.deb.debian.org:443
            api.github.com:443
            auth.docker.io:443
            builds.hex.pm:443
            dch.halostatue.ca:443
            debian.map.fastlydns.net:80
            dhi.io:443
            ghcr.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MMDD.HHmm' tz='UTC'}}
            type=sha,prefix=git-

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Check deployment notify
        id: check-notify
        run: |
          if [[ -n "${DCHOOK_URL}" ]] && [[ -n "${DCHOOK_SECRET}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          DCHOOK_SECRET: ${{ secrets.DCHOOK_SECRET }}

      - name: Install dchook-notify
        if: steps.check-notify.outputs.enabled == 'true'
        run: |
          gh release download "${DCHOOK_VERSION}" \
            --repo halostatue/dchook \
            --pattern "${DCHOOK_BASE}.tar.gz"
          gh attestation verify "${DCHOOK_BASE}.tar.gz" \
            --repo halostatue/dchook
          tar -xzf "${DCHOOK_BASE}.tar.gz" \
            --strip-components=1 \
            -C /usr/local/bin \
            "${DCHOOK_BASE}/dchook-notify"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger deployment
        if: steps.check-notify.outputs.enabled == 'true'
        env:
          DCHOOK_SECRET: ${{ secrets.DCHOOK_SECRET }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          echo "$DCHOOK_SECRET" > webhook_secret.txt
          chmod 400 webhook_secret.txt

          LABELS=$(echo "$METADATA_JSON" | jq '.labels | with_entries(select(.key | startswith("org.opencontainers.image")))')
          IMAGE=$(echo "$METADATA_JSON" | jq -r '.tags[0]')

          echo "$LABELS" | jq --arg image "$IMAGE" '. + {image: $image}' |
            dchook-notify -s webhook_secret.txt -

      - name: Clean up old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: "container"
          min-versions-to-keep: 3
        continue-on-error: true
